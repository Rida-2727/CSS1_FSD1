<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earth Dimensions</title>
    <link rel="stylesheet" href="styleset5.css">
</head>
<body>

    <!-- Change the width in .earth-container inside style1.css to see the inner box resize -->
    <div class="earth-container">
        <h3>Planet Earth</h3>
        <p>Parent width is fixed.</p>
        
        <div class="atmosphere">
            <strong>Atmosphere Layer</strong>
            <p>I am always 50% of the Earth's width.</p>
        </div>
    </div>
    
    <div class="outer-earth">
        Outer Div: Earth Crust (40px text)
        
        <div class="inner-core">
            Inner Div: Inner Core (80px text)
        </div>
    </div>

    <div class="skyView">
        <h1>Sky & Space</h1>
    </div>

    <div class="oceanView">
        <h1>Ocean & Earth </h1>
    </div>

</body>
</html>
